<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Termux Storage</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a2d;--panel2:#18233b;--line:#293653;--text:#f4f7ff;--muted:#9ba9c5;--accent:#72a7ff;--danger:#ff7185;--ok:#63d7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#1c3260 0,#0b1020 48%);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}.wrap{max-width:1060px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#79b6ff,#736cff);display:grid;place-items:center;font-size:23px;box-shadow:0 8px 24px #4e75cf55}.brand h1{font-size:21px;margin:0}.brand p{color:var(--muted);margin:2px 0 0;font-size:13px}.card{background:linear-gradient(180deg,#151f35ee,#10172aee);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 55px #03071355}.auth{max-width:520px;margin:8vh auto}.label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.row{display:flex;gap:10px}.input{width:100%;background:#0b1222;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 13px;outline:none}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #72a7ff22}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#071126;font-weight:700;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{color:#ffdce1;background:#4b1c2a;border:1px solid #7c2c41}.drop{border:1.5px dashed #48628e;text-align:center;padding:32px 18px;margin:22px 0 20px;transition:.2s}.drop.drag{border-color:var(--accent);background:#72a7ff12}.drop strong{display:block;font-size:17px;margin-bottom:5px}.muted{color:var(--muted)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:24px 0 12px}.toolbar h2{font-size:18px;margin:0}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid #202b43}.table tr:last-child td{border-bottom:0}.file-name{display:flex;align-items:center;gap:10px;font-weight:600}.file-icon{width:30px;height:30px;border-radius:8px;background:#24375d;display:grid;place-items:center}.actions{display:flex;justify-content:flex-end;gap:7px}.small{font-size:12px}.status{min-height:22px;margin-top:12px;color:var(--muted)}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:650px){.wrap{padding:18px 12px 40px}.top{align-items:flex-start}.row{flex-direction:column}.btn{width:100%}.table th:nth-child(2),.table td:nth-child(2){display:none}.actions{flex-direction:column}.actions .btn{width:auto;padding:8px 10px}.card{padding:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><div class="brand"><div class="logo">▣</div><div><h1>Termux Storage</h1><p>Private file server on your Android phone</p></div></div><button class="btn secondary" id="logout">Lock</button></header>
    <section class="card auth" id="authCard"><h2>Unlock your storage</h2><p class="muted">Enter the access token shown in the Termux terminal when the server starts.</p><label class="label" for="token">Access token</label><div class="row"><input class="input" id="token" type="password" autocomplete="off" placeholder="Paste your token here"/><button class="btn" id="connect">Connect</button></div><div class="status" id="authStatus"></div></section>
    <section id="app" class="hidden">
      <div class="card"><div id="drop" class="drop"><strong>Drop files here</strong><span class="muted">or choose files from your device</span><br/><br/><label class="btn" for="picker">Choose files</label><input id="picker" class="hidden" type="file" multiple/></div><div class="status" id="uploadStatus"></div></div>
      <div class="toolbar"><h2>Your files <span class="muted small" id="count"></span></h2><button class="btn secondary" id="refresh">Refresh</button></div>
      <div class="card"><div id="fileArea"></div></div>
    </section>
  </main>
<script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('storage_token')||'';
const size=n=>{if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(2)+' GB'};
function status(el,msg,kind=''){el.textContent=msg;el.className='status '+kind}
function headers(){return {'X-Storage-Token':token}}
async function connect(){token=$('#token').value.trim();if(!token)return status($('#authStatus'),'Please enter a token.','error');localStorage.setItem('storage_token',token);let r=await fetch('/api/files',{headers:headers()});if(r.ok){$('#authCard').classList.add('hidden');$('#app').classList.remove('hidden');load()}else{localStorage.removeItem('storage_token');status($('#authStatus'),'Invalid token or server unavailable.','error')}}
async function load(){let r=await fetch('/api/files',{headers:headers()});if(!r.ok){logout();return}let d=await r.json();$('#count').textContent=`(${d.count})`;let area=$('#fileArea');if(!d.files.length){area.innerHTML='<div class="empty">No files yet. Upload something to get started.</div>';return}area.innerHTML='<table class="table"><thead><tr><th>File</th><th>Size</th><th>Modified</th><th></th></tr></thead><tbody>'+d.files.map(f=>`<tr><td><div class="file-name"><span class="file-icon">▤</span>${escapeHtml(f.name)}</div></td><td class="muted">${size(f.size)}</td><td class="muted small">${escapeHtml(f.modified)}</td><td><div class="actions"><button class="btn secondary" onclick="downloadFile('${encodeURIComponent(f.path)}')">Download</button><button class="btn danger" onclick="removeFile('${encodeURIComponent(f.path)}','${escapeHtml(f.name)}')">Delete</button></div></td></tr>`).join('')+'</tbody></table>'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function downloadFile(path){window.location.href='/download/'+path+'?token='+encodeURIComponent(token)}
async function removeFile(path,name){if(!confirm('Delete '+name+'?'))return;let r=await fetch('/api/files/'+path,{method:'DELETE',headers:headers()});if(r.ok)load();else alert('Delete failed.')}
async function upload(files){if(!files.length)return;let st=$('#uploadStatus');for(const file of files){status(st,'Uploading '+file.name+'…');let form=new FormData();form.append('file',file);let r=await fetch('/api/upload',{method:'POST',headers:headers(),body:form});if(!r.ok){let e=await r.json().catch(()=>({}));status(st,e.error||'Upload failed.','error');return}}status(st,'Upload complete.','ok');load();setTimeout(()=>status(st,''),2500)}
function logout(){localStorage.removeItem('storage_token');token='';$('#app').classList.add('hidden');$('#authCard').classList.remove('hidden');$('#token').value=''}
$('#connect').onclick=connect;$('#token').onkeydown=e=>{if(e.key==='Enter')connect()};$('#logout').onclick=logout;$('#refresh').onclick=load;$('#picker').onchange=e=>upload([...e.target.files]);const drop=$('#drop');['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>upload([...e.dataTransfer.files]));if(token){$('#token').value=token;connect()}
</script>
</body>
</html>
